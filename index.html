<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gong Icon · Wayfinder</title>
<style>
  :root { --purple: #5b2bd6; --pink: #ff2d75; --team: #a21cf0; --ink: #1f1b2e; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(#b9defc 0%, #e6f2ff 55%, #f5eee6 100%);
  }
  #scene { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 16px; left: 16px; width: 290px; z-index: 10; padding: 16px;
    background: #fff; border-radius: 16px; box-shadow: 0 12px 32px rgba(40, 20, 90, .18);
  }
  #panel h1 { font-size: 16px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .logo {
    width: 26px; height: 26px; border-radius: 8px; background: var(--purple); color: #fff;
    display: grid; place-items: center; font-weight: 800;
  }
  .badge { background: #efe9ff; color: var(--purple); border-radius: 6px; padding: 2px 7px; font-size: 12px; }
  label.f { display: block; font-size: 12px; font-weight: 700; color: #6b6880; margin: 12px 0 5px; }
  .combo { position: relative; }
  .combo input {
    width: 100%; box-sizing: border-box; border: 2px solid #e3def3; border-radius: 10px;
    padding: 9px 30px 9px 11px; font-size: 14px; outline: none; font-family: inherit;
  }
  .combo input:focus { border-color: var(--purple); }
  .combo .chev { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #8a86a0; }
  .combo ul {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
    max-height: 320px; overflow: auto; margin: 0; padding: 4px; list-style: none;
    background: #fff; border-radius: 10px; box-shadow: 0 12px 28px rgba(40, 20, 90, .22);
  }
  .combo.open ul { display: block; }
  .combo li { padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .combo li.grp { font-size: 11px; font-weight: 700; color: #9a96ad; text-transform: uppercase; cursor: default; padding: 8px 9px 4px; }
  .combo li.active { background: #efe9ff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .ftag { margin-left: auto; font-size: 11px; font-weight: 700; color: #8a86a0; background: #f1eef9; border-radius: 5px; padding: 1px 6px; }
  #info { margin-top: 14px; font-size: 13px; line-height: 1.5; color: #4a4660; min-height: 20px; }
  #replay {
    margin-top: 12px; width: 100%; border: 0; border-radius: 10px; padding: 10px; cursor: pointer;
    background: var(--purple); color: #fff; font-weight: 700; font-size: 14px; font-family: inherit;
  }
  #replay:disabled { opacity: .35; cursor: default; }
  #floors {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 10; padding: 8px;
    display: flex; flex-direction: column; gap: 6px; background: #fff; border-radius: 14px;
    box-shadow: 0 12px 32px rgba(40, 20, 90, .18);
  }
  #floors .t { font-size: 10px; font-weight: 700; color: #9a96ad; text-align: center; text-transform: uppercase; }
  #floors button {
    position: relative; width: 46px; height: 38px; border: 0; border-radius: 10px; cursor: pointer;
    background: #f3f0fb; color: #4a4660; font-family: inherit; font-weight: 700; font-size: 15px;
  }
  #floors button.on { background: var(--purple); color: #fff; }
  #floors button.dest::after {
    content: ''; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--pink);
  }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #5d5a70;
    background: rgba(255, 255, 255, .75); padding: 6px 14px; border-radius: 20px;
  }
  #toast {
    position: fixed; top: 22px; left: 50%; transform: translate(-50%, -20px); opacity: 0; transition: .35s;
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 14px;
    pointer-events: none; z-index: 30;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #ride {
    position: fixed; inset: 0; z-index: 25; display: grid; place-content: center; gap: 10px; text-align: center;
    background: radial-gradient(#5b2bd6ee, #2a146ef2); color: #fff; font-size: 22px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  #ride.show { opacity: 1; }
  #ride .big { font-size: 64px; }
  .lbl {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff;
    white-space: nowrap; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .25s, box-shadow .25s;
  }
  .lbl.meeting { background: var(--pink); }
  .lbl.team { background: var(--team); font-size: 11px; }
  .lbl.other { background: #fff; color: #222; border: 1px solid #ccc; }
  .lbl.service { background: rgba(255, 255, 255, .88); color: #5a5670; font-weight: 600; font-size: 11px; }
  .lbl.you { background: var(--purple); font-size: 11px; }
  .lbl.hl { transform: scale(1.45); box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(255, 45, 117, .7); }
  .bubble {
    display: inline-block; position: relative; margin-bottom: 10px; padding: 4px 9px; border-radius: 10px;
    background: #fff; color: #2a2638; font-size: 12px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .2); opacity: 0; transform: translateY(6px) scale(.85);
    transition: opacity .25s, transform .25s;
  }
  .bubble.show { opacity: 1; transform: none; }
  .bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
    border: 6px solid transparent; border-bottom: 0; border-top-color: #fff;
  }
</style>

<body>
<div id="scene"></div>
<div id="panel">
  <h1><span class="logo">G</span> Gong Icon <span class="badge">Wayfinder</span></h1>
  <label class="f" for="from-in">I sit in</label>
  <div class="combo" id="from">
    <input id="from-in" autocomplete="off" spellcheck="false" placeholder="Pick your room…">
    <span class="chev">▾</span><ul></ul>
  </div>
  <label class="f" for="to-in">Take me to</label>
  <div class="combo" id="to">
    <input id="to-in" autocomplete="off" spellcheck="false" placeholder="Search a room, e.g. Rita">
    <span class="chev">▾</span><ul></ul>
  </div>
  <div id="info"></div>
  <button id="replay" disabled>↻ Replay walk</button>
</div>
<div id="floors"><div class="t">Floor</div></div>
<div id="ride"><div class="big">🛗</div><div id="ride-text"></div></div>
<div id="toast"></div>
<div id="hint">Drag to rotate · Right-drag to pan · Scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ==========================================================================
   1. RENDERER, CAMERA, LIGHTS, MATERIALS
   ========================================================================== */
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none';
host.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 400);
camera.position.set(-2, 44, 36);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-2, 0, 1.5);
controls.enableDamping = true;
controls.maxPolarAngle = 1.35;
controls.minDistance = 6;
controls.maxDistance = 110;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d0ea, 1.5));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.4);
sun.position.set(-16, 34, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 90 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const GRADIENT = new THREE.DataTexture(new Uint8Array([120, 190, 255]), 3, 1, THREE.RedFormat);
GRADIENT.minFilter = GRADIENT.magFilter = THREE.NearestFilter;
GRADIENT.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: GRADIENT, ...extra });

const COLORS = {
  corridor: 0xefeae2, slabSide: 0xb7b0a5, team: 0xd6ecd1, meeting: 0xeadfff, other: 0xfff1c9,
  lounge: 0xf4e1c4, deck: 0xcaa57a, kitchen: 0xf1d9ae, wc: 0xd9e6ef, booth: 0xf2ebff, core: 0xcdcad4,
  dining: 0xf6e6c6, cafe: 0xf7d6c1, void: 0xdcd9e2,
};
const MATS = {
  wall: toon(0xfaf8f4), cap: toon(0x4b4f66), glass: new THREE.MeshBasicMaterial({ color: 0x9fd4ff, transparent: true, opacity: 0.22, depthWrite: false }),
  glassCap: toon(0x5a6278), mullion: toon(0x6b7389), desk: toon(0xfdfcf9), deskLeg: toon(0x8b8fa3), screen: toon(0x2a2c38),
  chair: toon(0x3d3a4f), chairMeet: toon(0x7b4fe0), metal: toon(0xb9c1cc), table: toon(0xf0dcb8), sofa: toon(0xff8fb1),
  tub: toon(0xffc857), column: toon(0xe9e6e0), pot: toon(0xe0d6c6), leaf: toon(0x4fae5a),
  counter: toon(0xffffff), counterTop: toon(0x34364a), fridge: toon(0xd5dde7), stool: toon(0xff7a59), planter: toon(0xb88a5a),
  locker: toon(0xe7d3b2), printer: toon(0x50566b), stairs: toon(0xdedbd4), concrete: toon(0xc4c1cb), red: toon(0xe53935),
  coffee: toon(0x2b2b33), bean: toon(0x6f4e37), food: toon(0xf4a259), wood: toon(0xc8935e),
};
const OUTLINED = new Set(['wall', 'cap', 'glassCap', 'desk', 'screen', 'chair', 'chairMeet', 'table', 'sofa', 'tub', 'column',
  'counter', 'counterTop', 'fridge', 'planter', 'locker', 'printer', 'stairs', 'concrete', 'metal', 'pot', 'coffee', 'wood']);
const NO_SHADOW = new Set(['glass']);
const lineMat = new THREE.LineBasicMaterial({ color: 0x302a45, transparent: true, opacity: 0.5 });
const WALL_H = 2.1, FACADE_H = 2.8;
const G = 0.15;   // path-finding grid cell (m)

/* ==========================================================================
   2. FLOOR BUILDER
   Floor files (floors/fNN.js) give their layout in screenshot pixels; CUR.frame converts to meters.
   ========================================================================== */
let CUR = null;   // the floor being built; every builder below draws into it
const mx = x => (x - CUR.frame.cx) / CUR.frame.ppm;
const mz = y => (y - CUR.frame.cy) / CUR.frame.ppm;
const toM = ([x, y]) => [mx(x), mz(y)];
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Cyl = (rt, rb, h, s = 16) => new THREE.CylinderGeometry(rt, rb, h, s);
const put = (key, geo) => (CUR.batch[key] ||= []).push(geo);
const obstacle = (x, z, hw, hd, ry = 0) => CUR.obst.push({ x, z, hw, hd, ry });
function box(key, w, h, d, x, y, z, ry = 0) { const g = B(w, h, d); if (ry) g.rotateY(ry); g.translate(x, y, z); put(key, g); }
function cyl(key, rt, rb, h, x, y, z, s) { const g = Cyl(rt, rb, h, s); g.translate(x, y, z); put(key, g); }
// Put a part given in an object's local frame (facing +z) into world space.
function place(key, geo, lx, ly, lz, ry, wx, wz) { geo.translate(lx, ly, lz); if (ry) geo.rotateY(ry); geo.translate(wx, 0, wz); put(key, geo); }
function leaves(r, x, y, z) { const g = new THREE.IcosahedronGeometry(r, 0); g.translate(x, y, z); put('leaf', g); }

function flushBatches() {
  for (const [key, geos] of Object.entries(CUR.batch)) {
    const geo = mergeGeometries(geos);
    const mesh = new THREE.Mesh(geo, MATS[key]);
    mesh.castShadow = mesh.receiveShadow = !NO_SHADOW.has(key);
    CUR.group.add(mesh);
    if (OUTLINED.has(key)) CUR.group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), lineMat));
  }
  CUR.batch = {};
}
const shapeOf = poly => new THREE.Shape(poly.map(([x, y]) => new THREE.Vector2(mx(x), -mz(y))));
function floorMesh(poly, color, y = 0.01) {
  const geo = new THREE.ShapeGeometry(shapeOf(poly));
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, toon(color));
  mesh.position.y = y;
  mesh.receiveShadow = true;
  CUR.group.add(mesh);
  return mesh;
}
function centroid(poly) {
  let a = 0, x = 0, y = 0;
  poly.forEach(([x0, y0], i) => {
    const [x1, y1] = poly[(i + 1) % poly.length], f = x0 * y1 - x1 * y0;
    a += f; x += (x0 + x1) * f; y += (y0 + y1) * f;
  });
  return [x / (3 * a), y / (3 * a)];
}
function makeLabel(text, cls, x, y, h = 2.5) {
  const wrap = document.createElement('div');
  const span = document.createElement('span');
  span.className = 'lbl ' + cls;
  span.textContent = text;
  wrap.append(span);
  const obj = new CSS2DObject(wrap);
  obj.position.set(mx(x), h, mz(y));
  CUR.group.add(obj);
  return span;
}

// --- walls ---------------------------------------------------------------------
function segmentsOf(polylines) {
  const segs = [];
  for (const pl of polylines) for (let i = 0; i < pl.length - 1; i++) segs.push([pl[i], pl[i + 1]]);
  return segs;
}
// Split wall segments wherever a door sits on them (doors are [x, y, width m]).
function cutDoors(segs, doors) {
  const out = [], ppm = CUR.frame.ppm, tol = 0.17 * ppm;
  for (const [a, b] of segs) {
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const cuts = [];
    for (const [x, y, w] of doors) {
      const t = ((x - a[0]) * dx + (y - a[1]) * dy) / (L * L);
      if (t < 0 || t > 1 || Math.hypot(a[0] + t * dx - x, a[1] + t * dy - y) > tol) continue;
      const h = w * ppm / 2 / L;
      cuts.push([t - h, t + h]);
    }
    cuts.sort((p, q) => p[0] - q[0]);
    const at = t => [a[0] + t * dx, a[1] + t * dy];
    let t0 = 0;
    for (const [c0, c1] of cuts) {
      if (c0 > t0) out.push([at(t0), at(c0)]);
      CUR.jambs.push(at(c0), at(c1));
      t0 = Math.max(t0, c1);
    }
    if (t0 < 1) out.push([at(t0), b]);
  }
  return out.filter(([a, b]) => Math.hypot(b[0] - a[0], b[1] - a[1]) > ppm * 0.03);
}
function buildWalls(segs, h, t, key, capKey, navR) {
  for (const [a, b] of segs) {
    const ax = mx(a[0]), az = mz(a[1]), bx = mx(b[0]), bz = mz(b[1]);
    const L = Math.hypot(bx - ax, bz - az), ry = Math.atan2(-(bz - az), bx - ax);
    const cx = (ax + bx) / 2, cz = (az + bz) / 2;
    box(key, L + t, h, t, cx, h / 2, cz, ry);
    box(capKey, L + t + 0.01, 0.05, t + 0.03, cx, h + 0.025, cz, ry);
    CUR.navSegs.push([ax, az, bx, bz, navR]);
  }
}
function mullions(polylines) {
  for (const pl of polylines) {
    let acc = 0;
    for (let i = 1; i < pl.length; i++) {
      const [ax, az] = toM(pl[i - 1]), [bx, bz] = toM(pl[i]), L = Math.hypot(bx - ax, bz - az);
      for (let s = (1.6 - acc) % 1.6; s < L; s += 1.6) {
        const t = s / L;
        box('mullion', 0.07, FACADE_H, 0.1, ax + (bx - ax) * t, FACADE_H / 2, az + (bz - az) * t);
      }
      acc = (acc + L) % 1.6;
    }
  }
}

// --- furniture (positions in screenshot pixels unless the name ends with M) ------------
function chairM(wx, wz, yaw, key = 'chair') {
  place(key, B(0.46, 0.07, 0.44), 0, 0.46, 0, yaw, wx, wz);
  place(key, B(0.44, 0.42, 0.06), 0, 0.74, -0.21, yaw, wx, wz);
  place('metal', Cyl(0.03, 0.03, 0.38), 0, 0.24, 0, yaw, wx, wz);
  place('metal', Cyl(0.24, 0.24, 0.04), 0, 0.03, 0, yaw, wx, wz);
}
// side: +1 chair on the desk's local +z side, -1 on -z, 0 no chair.
function deskM(wx, wz, L, W, ry, side) {
  place('desk', B(L - 0.03, 0.035, W - 0.03), 0, 0.74, 0, ry, wx, wz);
  for (const s of [-1, 1]) place('deskLeg', B(0.05, 0.72, W - 0.12), s * (L / 2 - 0.08), 0.36, 0, ry, wx, wz);
  obstacle(wx, wz, L / 2, W / 2, ry);
  if (!side) return;
  const sz = -side * (W / 2 - 0.14);
  place('screen', B(0.58, 0.34, 0.03), 0, 1.0, sz, ry, wx, wz);
  place('deskLeg', B(0.06, 0.16, 0.06), 0, 0.83, sz - side * 0.03, ry, wx, wz);
  const lz = side * (W / 2 + 0.3);
  const seat = { x: wx + Math.sin(ry) * lz, z: wz + Math.cos(ry) * lz, yaw: ry + (side > 0 ? Math.PI : 0) };
  chairM(seat.x, seat.z, seat.yaw);
  CUR.deskSeats.push(seat);
}
function deskToward(wx, wz, L, W, ry, n) {
  deskM(wx, wz, L, W, ry, n ? Math.sign(n[0] * Math.sin(ry) + n[1] * Math.cos(ry)) || 1 : 0);
}
function deskCluster([x1, y1, x2, y2, nx, ny, sides]) {
  const cw = (x2 - x1) / nx, ch = (y2 - y1) / ny, horiz = cw >= ch, ppm = CUR.frame.ppm;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    let n = null;
    if (sides.includes('l') && i === 0) n = [-1, 0];
    else if (sides.includes('r') && i === nx - 1) n = [1, 0];
    else if (sides.includes('t') && j === 0) n = [0, -1];
    else if (sides.includes('b') && j === ny - 1) n = [0, 1];
    deskToward(mx(x1 + cw * (i + 0.5)), mz(y1 + ch * (j + 0.5)),
      (horiz ? cw : ch) / ppm, (horiz ? ch : cw) / ppm, horiz ? 0 : Math.PI / 2, n);
  }
}
// Rectangular table with [top, bottom, left, right] chair counts; its chairs become seats people can use.
function table([x1, y1, x2, y2], [nt, nb, nl, nr], key = 'table') {
  const ax = mx(x1), bx = mx(x2), az = mz(y1), bz = mz(y2), w = bx - ax, d = bz - az, cx = (ax + bx) / 2, cz = (az + bz) / 2;
  const index = CUR.tableCount++;
  box(key, w, 0.05, d, cx, 0.74, cz);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) cyl('metal', 0.035, 0.035, 0.72, cx + sx * (w / 2 - 0.12), 0.36, cz + sz * (d / 2 - 0.12));
  const row = (n, f) => { for (let i = 0; i < n; i++) f((i + 0.5) / n); };
  const seat = (x, z, yaw) => { chairM(x, z, yaw, 'chairMeet'); CUR.tableSeats.push({ x, z, yaw, table: index }); };
  row(nt, t => seat(ax + t * w, az - 0.36, 0));
  row(nb, t => seat(ax + t * w, bz + 0.36, Math.PI));
  row(nl, t => seat(ax - 0.36, az + t * d, Math.PI / 2));
  row(nr, t => seat(bx + 0.36, az + t * d, -Math.PI / 2));
  obstacle(cx, cz, w / 2, d / 2);
}
function armchair(px, py, fx, fy) {
  const x = mx(px), z = mz(py), yaw = Math.atan2(fx, fy);
  place('sofa', B(0.72, 0.4, 0.68), 0, 0.2, 0, yaw, x, z);
  place('sofa', B(0.72, 0.45, 0.16), 0, 0.6, -0.26, yaw, x, z);
  for (const s of [-1, 1]) place('sofa', B(0.14, 0.22, 0.6), s * 0.29, 0.5, 0.02, yaw, x, z);
  obstacle(x, z, 0.36, 0.34, yaw);
}
function tubChair(px, py, fx, fy) {
  const x = mx(px), z = mz(py), yaw = Math.atan2(fx, fy);
  place('tub', Cyl(0.32, 0.28, 0.42, 20), 0, 0.21, 0, yaw, x, z);
  place('tub', B(0.56, 0.32, 0.12), 0, 0.56, -0.24, yaw, x, z);
  obstacle(x, z, 0.32, 0.32);
}
function sofaRun(x1, y1, x2, y2, [fx, fy]) {

const SHIRTS = [0x3fa7d6, 0xf25f5c, 0xffd23f, 0x59cd90, 0xf7a072, 0x00bbf9, 0xee6c4d, 0x2ec4b6, 0xff99c8, 0xfcbf49,

function buildCrew(F) {
  const rand = F.rand, pick = list => list[Math.floor(rand() * list.length)];
  for (const c of F.crew) {
    const social = ['chat', 'stool', 'machine'].includes(c.kind);
    c.p = makePerson(F.group, {
      shirt: pick(SHIRTS), pants: pick(PANTS), skin: pick(SKINS), hair: pick(HAIRS), hairStyle: pick(STYLES),
      shoes: pick([0xffffff, 0x222222, 0x8b5a2b]), shortSleeves: rand() < 0.5, detailed: social, cup: c.cup,
    });
    const back = c.kind === 'stool' ? 0.12 : 0;   // sit back on the stool so the knees clear the bar
    c.p.root.position.set(c.x - Math.sin(c.yaw) * back, 0, c.z - Math.cos(c.yaw) * back);
    c.p.root.rotation.y = c.yaw;
    if (c.seatH) sit(c.p, c.seatH);
    c.seed = rand() * 10;
    if (c.group) {
      const wrap = document.createElement('div');
      c.bubble = document.createElement('span');
      c.bubble.className = 'bubble';
      wrap.append(c.bubble);
      const obj = new CSS2DObject(wrap);

  for (const c of F.crew) {
    if (c.kind !== 'meeting' && c.kind !== 'eat') continue;
    const mates = F.crew.filter(o => o.table === c.table && (o.kind === 'meeting' || o.kind === 'eat'));
    c.focus = mates.find(o => o.presenter)?.p.root.position
      || new THREE.Vector3(mates.reduce((s, o) => s + o.x, 0) / mates.length, 0, mates.reduce((s, o) => s + o.z, 0) / mates.length);
  }

function animateFloor(F, t, dt) {

  for (const g of F.groups) {
    if (!g.talk.length) continue;

  }

    const p = c.p, s = c.seed;

      p.elR.rotation.x = stretch ? -0.5 : -0.95 + (typing ? Math.sin(t * 15 + s * 5 + 2) * 0.07 : 0);

function pose(ph, amt) {
  const s = Math.sin(ph) * amt;
  P.hipL.rotation.x = s * 0.6; P.hipR.rotation.x = -s * 0.6;
  P.kneeL.rotation.x = Math.max(0, -Math.cos(ph)) * 0.7 * amt;
  P.kneeR.rotation.x = Math.max(0, Math.cos(ph)) * 0.7 * amt;
  P.shL.rotation.x = -s * 0.5; P.shR.rotation.x = s * 0.5;
  P.elL.rotation.x = P.elR.rotation.x = -0.3 * amt;
  P.shR.rotation.z = 0;
  P.body.position.y = Math.abs(Math.cos(ph)) * 0.035 * amt;
}

/* ==========================================================================
   6. ROUTE RIBBON AND DESTINATION PIN
   ========================================================================== */
const ribbonMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  uniforms: {
    uTime: { value: 0 }, uWalked: { value: 0 }, uFrom: { value: 0 }, uLen: { value: 1 },
    uA: { value: new THREE.Color(0x6d35e8) }, uB: { value: new THREE.Color(0xff2d75) },
  },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform float uTime, uWalked, uFrom, uLen; uniform vec3 uA, uB; varying vec2 vUv;
    void main() {
      float d = vUv.x, across = abs(vUv.y - 0.5) * 2.0;
      vec3 base = mix(uA, uB, clamp((uFrom + d) / uLen, 0.0, 1.0));
      float k = fract(d / 0.9 - uTime * 1.6 + across * 0.35);
      float chevron = smoothstep(0.0, 0.05, k) * (1.0 - smoothstep(0.28, 0.33, k)) * step(across, 0.75);
      vec3 col = mix(base, vec3(1.0), chevron * 0.85);
      float a = (1.0 - smoothstep(0.8, 1.0, across)) * (d < uWalked ? 0.3 : 0.95);
      gl_FragColor = vec4(col, a);
    }`,
});
// One ribbon per leg; colors run purple -> pink over the whole trip (uFrom/uLen).
function drawRibbon(leg, from, total) {
  const W = 0.42, pos = [], uv = [], idx = [];
  let s = 0;
  leg.pts.forEach((p, i) => {
    if (i) s += p.distanceTo(leg.pts[i - 1]);
    const a = leg.pts[Math.max(0, i - 1)], b = leg.pts[Math.min(leg.pts.length - 1, i + 1)];
    const dx = b.x - a.x, dz = b.z - a.z, l = Math.hypot(dx, dz) || 1, nx = -dz / l * W / 2, nz = dx / l * W / 2;
    pos.push(p.x + nx, 0.035, p.z + nz, p.x - nx, 0.035, p.z - nz);
    uv.push(s, 0, s, 1);
    if (i) { const k = i * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k); }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const mat = ribbonMat.clone();
  mat.uniforms.uFrom.value = from;
  mat.uniforms.uLen.value = total;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 5;
  leg.floor.group.add(mesh);
  return mesh;
}

const pin = new THREE.Group();
{
  const mat = toon(0xff2d75);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16), mat);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.62, 24), mat);
  tip.rotation.x = Math.PI;
  tip.position.y = -0.42;
  for (const m of [head, tip]) { const o = new THREE.Mesh(m.geometry, OUTLINE_MAT); o.scale.setScalar(1.08); m.add(o); m.castShadow = true; }
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  dot.position.z = 0.25;
  pin.add(head, tip, dot);
  pin.userData.ring = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.55, 40),
    new THREE.MeshBasicMaterial({ color: 0xff2d75, transparent: true, depthWrite: false }));
  pin.userData.ring.rotation.x = -Math.PI / 2;
  pin.visible = pin.userData.ring.visible = false;
}

/* ==========================================================================
   7. APP STATE, TRIP, CAMERA
   ========================================================================== */
const WALK_SPEED = 1.35, PLAYBACK = 2.2, ELEVATOR_SECONDS = 45;
const params = new URLSearchParams(location.search);
// Rooms are keyed "22/Rita"; a bare name matches the first floor that has it.
const findRoom = key => {
  if (!key) return null;
  const [f, name] = key.includes('/') ? key.split('/') : [null, key];
  return ALL_ROOMS.find(r => r.name === name && (!f || r.floor.id === +f)) || null;
};
const keyOf = r => `${r.floor.id}/${r.name}`;
let fromRoom = findRoom(params.get('from')) || findRoom(localStorage.getItem('icon.myRoom'));
let toRoom = findRoom(params.get('to'));
let viewFloor = null, walkerFloor = null, trip = null, phase = 0, waveUntil = 0, highlighted = null;
let camTween = null, follow = null;

const infoEl = document.getElementById('info'), replayBtn = document.getElementById('replay'), toastEl = document.getElementById('toast');
const rideEl = document.getElementById('ride'), rideText = document.getElementById('ride-text'), floorsEl = document.getElementById('floors');
const fmtTime = s => s < 50 ? `~${Math.max(5, Math.round(s / 5) * 5)} sec` : `~${Math.round(s / 60 * 2) / 2} min`;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

// Floor buttons, top floor first.
const floorButtons = {};
for (const F of FLOORS) {
  const b = document.createElement('button');
  b.textContent = F.id;
  b.title = `Floor ${F.id}`;
  b.addEventListener('click', () => { follow = null; showFloor(F.id); });
  floorsEl.append(b);
  floorButtons[F.id] = b;
}
function showFloor(id) {
  viewFloor = id;
  for (const F of FLOORS) {
    F.group.visible = F.id === id;
    floorButtons[F.id].classList.toggle('on', F.id === id);
  }
  P.root.visible = !!fromRoom && walkerFloor === id;
}

function tweenCamera(target, position, dur = 1.3) {
  camTween = { t: 0, dur, fromT: controls.target.clone(), fromP: camera.position.clone(), toT: target, toP: position };
}
function frameRoute(pts) {
  const bb = new THREE.Box3().setFromPoints(pts), center = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3());
  center.y = 0;
  const d = THREE.MathUtils.clamp(Math.max(size.x, size.z) * 1.5 + 10, 18, 70);
  const dir = camera.position.clone().sub(controls.target).setY(0);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
  dir.normalize();
  const polar = 0.78;
  tweenCamera(center, center.clone().addScaledVector(dir, Math.sin(polar) * d).setY(Math.cos(polar) * d));
  follow = center;
}
controls.addEventListener('start', () => { camTween = null; follow = null; });

function setHighlight(room) {
  if (highlighted) { highlighted.label.classList.remove('hl'); highlighted.floorMesh.material.emissive.setRGB(0, 0, 0); }
  highlighted = room;
  if (room) room.label.classList.add('hl');
  for (const F of FLOORS) floorButtons[F.id].classList.toggle('dest', !!room && room.floor === F);
}
function clearTrip() {
  for (const leg of trip?.plan?.legs || []) { leg.ribbon.removeFromParent(); leg.ribbon.geometry.dispose(); }
  for (const car of [trip?.plan?.carA, trip?.plan?.carB]) if (car) car.target = 0;
  trip = null;
  pin.removeFromParent();
  pin.userData.ring.removeFromParent();
  rideEl.classList.remove('show');
  setHighlight(null);
  replayBtn.disabled = true;
}
function placeWalker(F, pos, yaw = 0) {
  walkerFloor = F.id;
  P.root.position.copy(pos);
  P.root.rotation.y = yaw;
  pose(0, 0);
  P.root.visible = viewFloor === F.id;
}
function go() {
  clearTrip();
  if (!fromRoom) {
    walkerFloor = null;
    showFloor(viewFloor ?? floorById[+params.get('floor')]?.id ?? floorById[22]?.id ?? FLOORS[0].id);
    infoEl.innerHTML = 'First, pick the room you sit in.';
    return;
  }
  const A = fromRoom.floor;
  showFloor(A.id);
  placeWalker(A, navOf(A).point(fromRoom.spotM) || new THREE.Vector3(fromRoom.spotM[0], 0, fromRoom.spotM[1]));
  if (!toRoom) { infoEl.innerHTML = 'Now search for the room you need to get to.'; return; }
  setHighlight(toRoom);
  if (toRoom === fromRoom) { infoEl.innerHTML = `You're already in <b>${toRoom.name}</b> 🙂`; return; }
  const plan = planTrip(fromRoom, toRoom);
  if (!plan) { infoEl.innerHTML = 'Sorry, no walking route was found.'; return; }
  const total = plan.legs.reduce((s, l) => s + l.len, 0);
  let from = 0;
  for (const leg of plan.legs) { leg.ribbon = drawRibbon(leg, from, total); from += leg.len; }
  const last = plan.legs[plan.legs.length - 1], end = last.pts[last.pts.length - 1];
  pin.position.set(end.x, 3.1, end.z);
  pin.userData.ring.position.set(end.x, 0.04, end.z);
  pin.visible = pin.userData.ring.visible = true;
  last.floor.group.add(pin, pin.userData.ring);
  frameRoute(plan.legs[0].pts);
  trip = { plan, leg: 0, s: 0, state: 'walk', timer: 0 };
  replayBtn.disabled = false;
  const where = r => `<b>${r.name}</b> <span class="ftag">F${r.floor.id}</span>`;
  const time = total / WALK_SPEED + (plan.carA ? ELEVATOR_SECONDS : 0);
  infoEl.innerHTML = `${where(fromRoom)} → ${where(toRoom)}<br>${Math.round(total)} m` +
    (plan.carA ? ` + elevator ${fromRoom.floor.id} → ${toRoom.floor.id}` : '') + ` · ${fmtTime(time)}`;
}
replayBtn.addEventListener('click', go);

// Walk along a smoothed path; returns true at its end.
function walkAlong(path, s, dt) {
  const pts = path.pts, n = pts.length - 1, f = Math.min(n, s / path.len * n), i = Math.min(n - 1, Math.floor(f));
  P.root.position.copy(pts[i]).lerp(pts[i + 1], f - i);
  const ahead = pts[Math.min(n, i + 3)], behind = pts[Math.max(0, i - 1)];
  turnTo(Math.atan2(ahead.x - behind.x, ahead.z - behind.z), dt);
  phase += WALK_SPEED * PLAYBACK * dt / 1.5 * Math.PI * 2;
  pose(phase, 1);
  return s >= path.len;
}
const lerpAngle = (a, b, t) => a + (((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI) * t;
const turnTo = (yaw, dt) => { P.root.rotation.y = lerpAngle(P.root.rotation.y, yaw, 1 - Math.exp(-12 * dt)); };

// The trip: walk -> call the elevator -> board -> ride (switch floors) -> doors open -> walk -> arrive.
function updateTrip(t, dt) {
  const { plan } = trip, speed = WALK_SPEED * PLAYBACK;
  switch (trip.state) {
    case 'walk': {
      const leg = plan.legs[trip.leg];
      trip.s = Math.min(leg.len, trip.s + speed * dt);
      leg.ribbon.material.uniforms.uWalked.value = trip.s;
      if (trip.leg === 1 && trip.s > 2.5) plan.carB.target = 0;
      if (!walkAlong(leg, trip.s, dt)) break;
      pose(0, 0);
      if (trip.leg === 0 && plan.carA) {
        trip.state = 'call';
        trip.timer = 1.0;
        plan.carA.target = 1;
      } else {
        trip.state = 'arrived';
        waveUntil = t + 2.4;
        toast(`🎉 You've arrived at ${toRoom.name}`);
      }
      break;
    }
    case 'call':
      turnTo(Math.atan2(plan.carA.door.x - P.root.position.x, plan.carA.door.z - P.root.position.z), dt);
      if ((trip.timer -= dt) <= 0) {
        trip.state = 'board';
        trip.s = 0;
        trip.board = smoothPath([P.root.position.clone(), plan.carA.door.clone(), plan.carA.inside.clone()]);
      }
      break;
    case 'board':
      trip.s += speed * 0.6 * dt;
      if (walkAlong(trip.board, Math.min(trip.s, trip.board.len), dt)) {
        pose(0, 0);
        trip.state = 'close';
        trip.timer = 1.0;
        plan.carA.target = 0;
      }
      break;
    case 'close':
      turnTo(plan.carA.yawOut, dt);
      if ((trip.timer -= dt) <= 0) {
        trip.state = 'ride';
        trip.timer = 2.6;
        const a = plan.legs[0].floor.id, b = plan.legs[1].floor.id;
        rideText.textContent = `Floor ${a} ${b < a ? '↓' : '↑'} Floor ${b}`;
        rideEl.classList.add('show');
      }
      break;
    case 'ride':
      trip.timer -= dt;
      if (!trip.switched && trip.timer < 1.7) {
        trip.switched = true;
        const Bf = plan.legs[1].floor;
        showFloor(Bf.id);
        placeWalker(Bf, plan.carB.inside, plan.carB.yawOut);
        frameRoute(plan.legs[1].pts);
      }
      if (trip.timer <= 0) {
        rideEl.classList.remove('show');
        trip.state = 'open';
        trip.timer = 0.9;
        plan.carB.target = 1;
      }
      break;
    case 'open':
      if ((trip.timer -= dt) <= 0) { trip.state = 'walk'; trip.leg = 1; trip.s = 0; }
      break;
    case 'arrived':
      pose(0, 0);
      if (t < waveUntil) P.shR.rotation.z = -2.5 + Math.sin(t * 12) * 0.35;
      break;
  }
}

/* ==========================================================================
   8. SEARCHABLE DROPDOWNS
   ========================================================================== */
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '').replace(/(^|\D)0+(?=\d)/g, '$1');
const DOT = { meeting: '#ff2d75', team: '#a21cf0', other: '#c9b26a' };
const label = r => `${r.name} · F${r.floor.id}`;
function combo(id, rooms, onPick) {
  const el = document.getElementById(id), input = el.querySelector('input'), ul = el.querySelector('ul');
  let shown = [], active = 0;
  const render = () => {
    const q = input.value === input.dataset.value ? '' : norm(input.value);
    shown = rooms.filter(r => norm(r.name).includes(q) || norm(`f${r.floor.id} floor${r.floor.id}`).includes(q));
    active = Math.min(active, Math.max(0, shown.length - 1));
    ul.innerHTML = '';
    let group = null;
    shown.forEach((r, i) => {
      if (r.floor.id !== group) { group = r.floor.id; ul.insertAdjacentHTML('beforeend', `<li class="grp">Floor ${group}</li>`); }
      const li = document.createElement('li');
      li.dataset.i = i;
      li.innerHTML = `<span class="dot" style="background:${DOT[r.type] || DOT.other}"></span>${r.name}<span class="ftag">F${r.floor.id}</span>`;
      if (i === active) li.classList.add('active');
      ul.append(li);
    });
    if (!shown.length) ul.innerHTML = '<li class="grp">No match</li>';
    ul.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
  };
  const pick = r => { input.value = input.dataset.value = label(r); el.classList.remove('open'); input.blur(); onPick(r); };
  input.addEventListener('focus', () => { active = 0; render(); el.classList.add('open'); input.select(); });
  input.addEventListener('input', () => { active = 0; render(); el.classList.add('open'); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { active = Math.max(0, Math.min(shown.length - 1, active + (e.key === 'ArrowDown' ? 1 : -1))); render(); e.preventDefault(); }
    else if (e.key === 'Enter' && shown[active]) pick(shown[active]);
    else if (e.key === 'Escape') input.blur();
  });
  input.addEventListener('blur', () => setTimeout(() => { el.classList.remove('open'); input.value = input.dataset.value || ''; }, 120));
  ul.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pick(shown[+li.dataset.i]); } });
  return { set: r => { input.value = input.dataset.value = r ? label(r) : ''; } };
}
const order = { meeting: 0, other: 1, team: 2 };
const byFloorThenType = (a, b) => b.floor.id - a.floor.id || order[a.type] - order[b.type] || a.name.localeCompare(b.name);
const fromCombo = combo('from', ALL_ROOMS.filter(r => r.type === 'team').sort(byFloorThenType), r => {
  fromRoom = r;
  localStorage.setItem('icon.myRoom', keyOf(r));
  go();
});
const toCombo = combo('to', [...ALL_ROOMS].sort(byFloorThenType), r => { toRoom = r; go(); });
fromCombo.set(fromRoom);
toCombo.set(toRoom);
go();

/* ==========================================================================
   9. RENDER LOOP
   ========================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  // Shift the picture right so the floor isn't hidden behind the side panel.
  if (w > 900) camera.setViewOffset(w, h, -130, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (trip) updateTrip(t, dt);
  else P.body.position.y = Math.sin(t * 2) * 0.008;
  animateFloor(floorById[viewFloor], t, dt);
  for (const leg of trip?.plan.legs || []) leg.ribbon.material.uniforms.uTime.value = t;

  if (pin.visible) {
    pin.position.y = 3.1 + Math.sin(t * 3) * 0.15;
    pin.rotation.y = t * 1.5;
    const k = (t * 0.8) % 1, ring = pin.userData.ring;
    ring.scale.setScalar(1 + k * 2.2);
    ring.material.opacity = 0.8 * (1 - k);
  }
  if (highlighted) {
    const k = 0.18 + 0.14 * Math.sin(t * 4);
    highlighted.floorMesh.material.emissive.setRGB(k, k * 0.2, k * 0.5);
  }

  if (camTween) {
    camTween.t += dt;
    const k = Math.min(1, camTween.t / camTween.dur), e = k * k * (3 - 2 * k);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    camera.position.lerpVectors(camTween.fromP, camTween.toP, e);
    if (k >= 1) camTween = null;
  } else if (follow && trip?.state === 'walk' && walkerFloor === viewFloor) {
    const goal = follow.clone().lerp(P.root.position, 0.25).sub(controls.target).multiplyScalar(1 - Math.exp(-1.5 * dt));
    controls.target.add(goal);
    camera.position.add(goal);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
</body>
